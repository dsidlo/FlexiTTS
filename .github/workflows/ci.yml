name: CI

on:
  push:
    branches: [main, electro-bun]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  UV_CACHE_DIR: /tmp/.uv-cache
  PIP_ROOT_USER_ACTION: ignore

# Least privilege: tests read nothing; packaging writes packages + releases.
permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history to scan all commits

      # Plain gitleaks binary (not gitleaks-action, which requires the
      # GitHub context that act does not populate). Reads .gitleaksignore
      # from the repo root for triaged false positives.
      - name: Run gitleaks (full git history)
        run: |
          curl -sSL --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --config .gitleaksignore --verbose --redact -v .

  test-python:
    name: Scripts + Integration tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # qwen-tts is a path dependency (pyproject.toml -> Qwen3-TTS).
      # It is NOT part of this repo; clone it into place before uv sync.
      - name: Checkout Qwen3-TTS (path dependency)
        run: |
          git clone --depth 1 https://github.com/QwenLM/Qwen3-TTS.git Qwen3-TTS

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-

      - name: Install system deps (sox, ffmpeg for audio probing)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sox ffmpeg

      # Phase 7 bridge tests resolve stories via ~/.config/FlexiTTS config.
      # CI must point it at the checked-out repo (dev machines have this).
      - name: Write FlexiTTS config pointing at repo Stories
        run: |
          mkdir -p ~/.config/FlexiTTS
          cat > ~/.config/FlexiTTS/FlexiTTS.yaml <<CFG
          FlexiTTS:
            stories-dir: "${{ github.workspace }}/Stories"
            story-dir-prefix: "Story-"
            config-backup-count: 10
          CFG

      - name: Sync python env (locked)
        run: uv sync --locked

      - name: Run pytest (scripts + integration)
        run: |
          cd src/scripts
          set -o pipefail
          uv run --project ../.. pytest tests/ -p no:cacheprovider -o addopts= \
            --junitxml=test-results/pytest-junit.xml \
            -ra --tb=short 2>&1 | tee test-results/pytest-stdout.log
      # Surface failing tests + junit summary in the job log itself so the
      # failure is diagnosable without downloading artifacts.
      - name: Summarize pytest results
        if: always()
        run: |
          cd src/scripts
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse('test-results/pytest-junit.xml').getroot()
          except Exception as e:
              print('no junit:', e); raise SystemExit(0)
          suites = root.findall('testsuite') or [root]
          total_failed = 0
          summary_lines = []
          for t in suites:
              line = f"junit tests={t.get('tests')} failures={t.get('failures')} errors={t.get('errors')} skipped={t.get('skipped')}"
              print(line)
              summary_lines.append(line)
              total_failed += int(t.get('failures') or 0) + int(t.get('errors') or 0)
          failed_block = []
          for tc in root.iter('testcase'):
              f = tc.find('failure')
              if f is not None:
                  failed_block.append('FAILED: %s :: %s' % (tc.get('classname'), tc.get('name')))
                  failed_block.append((f.text or '')[:1500])
          for line in failed_block:
              print(line)
          # Mirror the summary into the run's job summary page for 1-click reading
          if summary_lines:
              with open('$GITHUB_STEP_SUMMARY', 'a') as s:
                  s.write('### pytest results\n```\n' + '\n'.join(summary_lines + failed_block) + '\n```\n')
          # Emit each failure as a check-run annotation (public API readable)
          for i in range(0, len(failed_block), 2):
              name = failed_block[i]
              detail = failed_block[i + 1] if i + 1 < len(failed_block) else ''
              lines = [l for l in detail.splitlines() if l.strip()]
              tail = lines[-8:]
              print('::error title=pytest failure::' + name + ' ||| ' + ' / '.join(tail)[:800])
          PY

      - name: Upload python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: src/scripts/test-results/pytest-junit.xml
          retention-days: 30
          if-no-files-found: warn

  test-ui:
    name: UI tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install UI deps
        run: npm ci

      - name: Run vitest
        run: npx vitest run --reporter=basic

      - name: Typecheck electron main/preload (must stay green)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Build renderer bundle (vite, no tsc -b gate until 67 errors fixed)
        run: npx vite build

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: src/ui/test-reports/
          retention-days: 30
          if-no-files-found: warn

  package-electron:
    name: Package with electron-builder
    needs: [secrets-scan, test-python, test-ui]
    # Release publishing on tag builds needs contents:write; job-level grant
    # overrides the read-only workflow default.
    permissions:
      contents: write
    # Artifacts are produced for main pushes and tag pushes only.
    # Branch pushes (e.g. electro-bun) run tests without packaging churn.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Qwen3-TTS (sidecar extraResource)
        run: |
          cd ../..
          git clone --depth 1 https://github.com/QwenLM/Qwen3-TTS.git Qwen3-TTS

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install UI deps
        run: npm ci

      - name: Build renderer (vite)
        run: npx vite build

      - name: Build electron main + preload
        run: npm run electron:build

      # Tag builds (v*) publish to GitHub Releases; main pushes produce
      # run artifacts only. GH_TOKEN is only referenced on tag builds.
      # Version: tag name on v* builds, 0.1.0-<shortsha> otherwise.
      - name: Compute version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "APP_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.1.0-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Package Linux AppImage (electron-builder)
        if: github.ref_type != 'tag'
        run: >-
          npx electron-builder --linux AppImage --publish never
          --config.extraMetadata.version="$APP_VERSION"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish AppImage to GitHub Release (tag builds)
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        run: >-
          npx electron-builder --linux AppImage --publish always
          --config.extraMetadata.version="$APP_VERSION"
        env:
          # unsigned build: keep CI deterministic; signing wired later
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: flexitts-linux
          retention-days: 30
          path: |
            src/ui/dist-packages/*.AppImage
          if-no-files-found: error








