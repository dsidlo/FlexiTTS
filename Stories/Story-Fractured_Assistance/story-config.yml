global:
  # This is the root directory for the story project
  story-dir: Story-Fractured_Assistance/
  # Place character voice references here
  voices: story-voice-refs/
  # Place the Markdown format of original story chapters here
  chapters: story-chapters/
  # AI XML breakdown of story chapters by character is saved here
  story-xml: story-xml/
  # Logs are saved here
  logs: logs/
  story-audio: story-audio/
  # Generated character voice clips for the story are saved here
  clips: story-audio/clips/
  # A silence of n seconds between audio-clips.
  clip-separation: 0.3
  max_voice_cache_size: 10
  tts-device: auto
llm-xml-generator:
  # Configuration for the LLM XML formatter
  # Set to true to enable XML formatting
  # The LLM key is read from your ~/.env file
  - default-llm: grok
    model: xai/grok-4-fast-reasoning
    api_key: os.environ/XAI_API_KEY
    api_base: https://api.x.ai/v1
  # optional rate limits
  # rpm: 200
  # timeout: 120
  - llm: lm-studio
    model: openai/gemma-3-12b
    api_base: http://localhost:1234/v1
    temperature: 0.3
    # max_tokens: 400
dialog-effects:
  - name: cave
    # The dialog-effects section can only have one - sox-effects:
    # attibute per named dialog-effects:
    sox-effects:
      # Multiple sox-effects can be layered and processed in seq order
      - pitch -400   echo 0.8 0.88 60 0.4 120 0.3   reverb
  - name: test-1
    # The dialog-effects section can only have one - sox-effects:
    # attibute per named dialog-effects:
    sox-effects:
      # Multiple sox-effects can be layered and processed in seq order
      - pitch -401   echo 0.8 0.88 60 0.4 120 0.3   reverb
      - pitch -402   echo 0.8 0.88 60 0.4 120 0.3   reverb
      - pitch -403   echo 0.8 0.88 60 0.4 120 0.3   reverb
story-audio-post-process:
    # The following sox effects are applied after the final full chapter audio file has been created.
    sox-effects:
      - normalize
characters:
  # Supported Qwen3-TTS Custom-Voice Speakers:
  # ['aiden', 'dylan', 'eric', 'ono_anna', 'ryan', 'serena', 'sohee', 'uncle_fu', 'vivian']
  #   Vivian: Bright, slightly edgy young female voice.                    | Chinese
  #   Serena: Warm, gentle young female voice.                             | Chinese
  # Uncle_Fu: Seasoned male voice with a low, mellow timbre.               | Chinese
  #    Dylan: Youthful Beijing male voice with a clear, natural timbre.    | Chinese (Beijing Dialect)
  #     Eric: Lively Chengdu male voice with a slightly husky brightness.  | Chinese (Sichuan Dialect)
  #     Ryan: Dynamic male voice with strong rhythmic drive.               | English
  #    Aiden: Sunny American male voice with a clear midrange.             | English
  # Ono_Anna: Playful Japanese female voice with a light, nimble timbre.   | Japanese
  #    Sohee: Warm Korean female voice with rich emotion.                  | Korean
  - name: Narrator
    # The narrator voice uses voice cloning and a post-effect to make it a bit louder.
    voice-sample: Narrator-voice.wav
    sox-effects:
      - gain +4
  - name: Narrator-cv
    # This version of the narrator voice uses Qwen3-TTS voice customization.
    # It customizes one of Qwen3-TTS's 9 internal voices using sox post-processing
    # to make it deeper and rougher.
    custom-voice:
      language: English
      speaker: ryan
      instruct: "Deep manly voice. Speach is moderately fast, slightly hushed."
    sox-effects:
      - treble -5 5000 0.7 compand 0.3,1 6:-70,-60,-20 -4 -90 0.1 gain -3
  - name: Jax
    custom-voice:
      language: English
      speaker: ryan
      instruct: "Deep manly voice with a rough texture. Speach is calm and calculating, moderately fast."
    sox-effects:
      - overdrive 15 30 gain -8
  - name: Yamato
    custom-voice:
      language: English
      speaker: ryan
      instruct: "An mature man. Speech is gruff and abrupt with a hit of frustration."
    sox-effects:
      - pitch -250 equalizer 1800 +4 1.8 equalizer 3200 +3 2.2 bass +2 120 gain -n -1.5
  - name: Echo
    voice-sample: Ayana-voice.wav
  - name: Hayden
    custom-voice:
      language: English
      speaker: Aiden
      instruct: "Deep manly voice with a rough texture"
  - name: Announcer
    custom-voice:
      language: English
      speaker: Ryan
      instruct: "Deep clear Voice, medium speed, Being as a radio announcer, Emphatic, Direct."
  - name: Yakuza-1
    custom-voice:
      language: English
      speaker: Uncle_Fu
      instruct: "Wicked, Sneering"
    sox-effects:
      - pitch -400   echo 0.8 0.88 60 0.4 120 0.3 reverb gain +3
  # Examples Voice Configurations
  - name: Hendrix-vc
    voice-sample: Hendricks-voice.wav
  - name: Yamato-vc
    voice-sample: Yamato-voice.wav
  - name: Hendrix-echo
    voice-sample: Hendricks-voice-x.wav
    dialog-effects:
      # named dialog-effects can be layered
      - cave
      - caves
      - xxx
  - name: Ayana-echo
    voice-sample: Ayana-voice.wav
    sox-effects:
      - pitch -400   echo 0.8 0.88 60 0.4 120 0.3 reverb
  - name: AI-001
    custom-voice:
      language: English
      speaker: Serena
      instruct: "Giggling, Overtly sexual vibes."
#    dialog-effects:
#      - cave
  - name: Jaakel
    custom-voice:
      language: English
      speaker: Uncle_Fu
      instruct: "Wicked, Sneering"
